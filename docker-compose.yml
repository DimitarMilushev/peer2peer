services:
  central-server:
    hostname: p2p-server
    build:
      context: server
      dockerfile: Dockerfile
    container_name: p2p-server
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    networks:
      - p2p-network

  client-1:
    hostname: client-1
    stdin_open: true
    build:
      context: client
      dockerfile: Dockerfile
    container_name: p2p-client-1
    ports:
      - "5005:5005"
    environment:
      - SERVER_HOST=p2p-server
      - SERVER_PORT=8081
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      - central-server
    networks:
      - p2p-network

  client-2:
    hostname: client-1
    stdin_open: true
    build:
      context: client
      dockerfile: Dockerfile
    container_name: p2p-client-2
    ports:
      - "5006:5005"
    environment:
      - SERVER_HOST=p2p-server
      - SERVER_PORT=8081
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      - central-server
    networks:
      - p2p-network

networks:
  p2p-network:
    driver: bridge
